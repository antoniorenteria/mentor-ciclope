<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mentor Cíclope">
<title>El Mentor Cíclope · El Anillo del Cíclope</title>
<link rel="icon" type="image/png" sizes="512x512" href="img/icono.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icono-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
  rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ============ tokens — tema claro por default (igual que el Ojo Maestro) ============ */
:root{
  --amarillo:#E8B800; --amarillo-fuerte:#C99A00; --amarillo-suave:#FFF3C4;
  --morado:#7C3AED; --morado-med:#6B21A8; --morado-oscuro:#3B0764;
  --fondo:#FFFFFF; --fondo-2:#FFFFFF; --fondo-3:#F7F7FA; --fondo-4:#EFEFF4;
  --texto:#111114; --muted:#65656F; --borde:#D8D8DE;
  --ok:#15803D; --alerta:#B91C1C; --aviso:#B45309;
  --radio:18px; --sombra:0 6px 22px rgba(20,10,40,.08);
}
html[data-tema="oscuro"]{
  --amarillo:#FFD523; --amarillo-fuerte:#FFE470; --amarillo-suave:#3A2E00;
  --morado:#9333EA; --fondo:#050008; --fondo-2:#0D0015; --fondo-3:#130020; --fondo-4:#1B0A2E;
  --texto:#F5F0FF; --muted:#9B87B8; --borde:rgba(147,51,234,.32);
  --ok:#4ADE80; --alerta:#F87171; --aviso:#FBBF24;
  --sombra:0 10px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--fondo);color:var(--texto);
  font-family:'Poppins',system-ui,sans-serif;font-size:16px;min-height:100%}
html[data-tema="oscuro"] body{background:
  radial-gradient(1100px 500px at 85% -5%, rgba(107,33,168,.28), transparent 60%),
  radial-gradient(900px 480px at -10% 30%, rgba(59,7,100,.35), transparent 60%),
  var(--fondo); background-attachment:fixed}
h1,h2,h3,.tit{font-family:'SerifGothic','Poppins',serif;letter-spacing:.4px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.2rem;margin:0 0 12px}
h3{font-size:1rem;margin:0 0 8px}
a{color:var(--morado)}
p{line-height:1.55}
.screen{display:none;max-width:1080px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px 120px;animation:fadein .22s ease}
.screen.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  margin:calc(-14px - env(safe-area-inset-top)) -16px 14px;
  padding:calc(20px + env(safe-area-inset-top)) 16px 12px;
  background:color-mix(in srgb, var(--fondo) 88%, transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--borde)}
.topbar img.logo{height:38px}
.topbar .sub{font-size:.68rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.topbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;padding:5px 11px;border-radius:99px;
  background:var(--fondo-3);border:1px solid var(--borde);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.off .dot{background:var(--aviso)}
.iconbtn{border:1px solid var(--borde);background:var(--fondo-3);color:var(--texto);
  border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;flex:none}

/* ---------- tarjetas ---------- */
.card{background:var(--fondo-2);border:1px solid var(--borde);border-radius:var(--radio);
  padding:18px;box-shadow:var(--sombra);margin-bottom:14px}
html[data-tema="oscuro"] .card{background:linear-gradient(160deg,var(--fondo-3),var(--fondo-2))}
.card.acento{border-left:5px solid var(--amarillo)}
.card.peligro{border-left:5px solid var(--alerta)}
.card.ok{border-left:5px solid var(--ok)}
.card h2{color:var(--texto)}
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.grid.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid.c3{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}
.mut{color:var(--muted)}
.peq{font-size:.8rem}
.mini{font-size:.72rem}
.centro{text-align:center}
.sep{height:1px;background:var(--borde);margin:14px 0}

/* ---------- botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  border:none;border-radius:14px;padding:14px 18px;font-family:'Poppins';font-weight:600;font-size:1rem;
  cursor:pointer;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--amarillo),var(--amarillo-fuerte));color:#1A1400}
.btn.m{background:linear-gradient(135deg,var(--morado),var(--morado-med));color:#fff}
.btn.s{background:var(--fondo-3);color:var(--texto);border:1px solid var(--borde)}
.btn.s:hover{border-color:var(--amarillo)}
.btn.peligro{background:transparent;color:var(--alerta);border:1px solid var(--alerta)}
.btn.chico{width:auto;padding:8px 14px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fila.der{justify-content:flex-end}

/* ---------- menú principal ---------- */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.menu-item{background:var(--fondo-2);border:1px solid var(--borde);border-radius:var(--radio);
  padding:18px 14px;text-align:center;cursor:pointer;transition:.15s;box-shadow:var(--sombra)}
html[data-tema="oscuro"] .menu-item{background:linear-gradient(160deg,var(--fondo-3),var(--fondo-2))}
.menu-item:hover{border-color:var(--amarillo);transform:translateY(-2px)}
.menu-item .em{font-size:1.9rem;display:block;margin-bottom:6px}
.menu-item .t{font-weight:700;font-size:.96rem}
.menu-item .d{font-size:.72rem;color:var(--muted);margin-top:3px;line-height:1.35}
.menu-item .pin{display:inline-block;margin-top:7px;font-size:.66rem;font-weight:700;
  padding:3px 8px;border-radius:99px;background:var(--alerta);color:#fff}

/* ---------- formularios ---------- */
label{display:block;font-size:.78rem;color:var(--muted);margin:12px 0 5px;font-weight:500}
input,select,textarea{width:100%;background:var(--fondo);border:1px solid var(--borde);
  color:var(--texto);border-radius:12px;padding:12px 13px;font-family:'Poppins';font-size:1rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--morado)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input[type=number]{-moz-appearance:textfield}

/* ---------- PIN ---------- */
.pinpad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center;margin:16px 0}
.pinpad button{height:64px;border-radius:16px;border:1px solid var(--borde);background:var(--fondo-3);
  color:var(--texto);font-size:1.45rem;font-family:'Poppins';font-weight:600;cursor:pointer}
.pinpad button:active{background:var(--fondo-4)}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:10px 0}
.pin-dots span{width:15px;height:15px;border-radius:50%;border:2px solid var(--morado)}
.pin-dots span.full{background:var(--amarillo);border-color:var(--amarillo)}

/* ---------- métricas ---------- */
.kpi{background:var(--fondo-3);border:1px solid var(--borde);border-radius:14px;padding:14px 14px 12px}
.kpi .et{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;line-height:1.3}
.kpi .v{font-size:1.5rem;font-weight:800;margin-top:5px;line-height:1.1}
.kpi .d{font-size:.72rem;margin-top:4px;color:var(--muted)}
.kpi .d.sube{color:var(--ok);font-weight:600}
.kpi .d.baja{color:var(--alerta);font-weight:600}
.kpi.alerta{border-color:var(--alerta);background:color-mix(in srgb,var(--alerta) 8%,var(--fondo-3))}

/* ---------- barras / niveles ---------- */
.barra{height:9px;border-radius:99px;background:var(--fondo-4);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--morado);transition:width .4s}
.nivel-chip{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;
  padding:4px 10px;border-radius:99px;color:#fff}
.area-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--borde);cursor:pointer}
.area-row:last-child{border-bottom:none}
.area-row .em{font-size:1.5rem;flex:none;width:32px;text-align:center}
.area-row .info{flex:1;min-width:0}
.area-row .info .n{font-weight:600;font-size:.95rem}
.area-row .info .sub{font-size:.72rem;color:var(--muted)}
.area-row .fl{font-size:1.1rem;color:var(--muted);flex:none}

/* ---------- radar ---------- */
.radar-wrap{display:flex;justify-content:center;padding:6px 0 2px}
svg.radar{max-width:100%;height:auto}

/* ---------- listas ---------- */
.item{display:flex;gap:11px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--borde)}
.item:last-child{border-bottom:none}
.item .em{font-size:1.15rem;flex:none;line-height:1.4}
.item .cuerpo{flex:1;min-width:0}
.item .cuerpo .t{font-weight:600;font-size:.93rem}
.item .cuerpo .d{font-size:.78rem;color:var(--muted);margin-top:3px;line-height:1.45}
.sev{font-size:.62rem;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.5px;flex:none}
.sev.s3{background:var(--alerta);color:#fff}
.sev.s2{background:var(--aviso);color:#fff}
.sev.s1{background:var(--fondo-4);color:var(--muted)}

/* ---------- opciones de respuesta ---------- */
.ops{display:grid;gap:8px;margin-top:10px}
.op{border:1px solid var(--borde);background:var(--fondo);border-radius:12px;padding:12px 14px;
  cursor:pointer;font-size:.9rem;text-align:left;font-family:'Poppins';color:var(--texto);display:flex;gap:10px;align-items:center}
.op:hover{border-color:var(--morado)}
.op.sel{border-color:var(--morado);background:color-mix(in srgb,var(--morado) 10%,var(--fondo));font-weight:600}
.op .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--borde);flex:none}
.op.sel .mk{border-color:var(--morado);background:var(--morado);box-shadow:inset 0 0 0 3px var(--fondo)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;border:1px solid var(--borde);background:var(--fondo-3);color:var(--muted);
  border-radius:99px;padding:8px 15px;font-size:.82rem;font-family:'Poppins';font-weight:600;cursor:pointer}
.tabs button.on{background:var(--morado);color:#fff;border-color:var(--morado)}

/* ---------- tablas ---------- */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--borde);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
td.num,th.num{text-align:right}
tr.total td{font-weight:800;border-top:2px solid var(--borde)}

/* ---------- bitácora ---------- */
.log{border-left:3px solid var(--borde);padding:0 0 0 14px;margin:0 0 4px}
.log .e{padding:11px 0;border-bottom:1px solid var(--borde)}
.log .e:last-child{border-bottom:none}
.log .f{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.log .t{font-weight:600;font-size:.9rem;margin-top:2px}
.log .c{font-size:.83rem;color:var(--muted);margin-top:3px;line-height:1.5;white-space:pre-wrap}

/* ---------- lección ---------- */
.leccion{background:var(--fondo-3);border:1px solid var(--borde);border-radius:14px;padding:15px;margin-bottom:10px}
.leccion .fu{font-size:.7rem;color:var(--morado);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.leccion .ti{font-weight:700;font-size:1rem;margin:4px 0 7px}
.leccion p{margin:0 0 8px;font-size:.86rem;line-height:1.55}
.leccion .et{font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

/* ---------- checkbox de módulo ---------- */
.mod{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--borde)}
.mod:last-child{border-bottom:none}
.mod .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--borde);flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.9rem;background:var(--fondo)}
.mod .chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mod .cuerpo{flex:1;min-width:0}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  background:var(--texto);color:var(--fondo);padding:13px 20px;border-radius:14px;font-weight:600;
  font-size:.88rem;z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.modal-bg{position:fixed;inset:0;background:rgba(10,4,20,.62);z-index:90;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.on{display:flex}
.modal{background:var(--fondo);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88vh;
  overflow-y:auto;padding:20px 18px calc(26px + env(safe-area-inset-bottom));border:1px solid var(--borde)}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:22px;max-height:84vh}}

/* ---------- FAB volver ---------- */
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;
  border:1px solid var(--borde);background:var(--fondo);color:var(--texto);border-radius:99px;
  padding:12px 20px;font-family:'Poppins';font-weight:600;font-size:.88rem;cursor:pointer;box-shadow:var(--sombra);display:none}
.fab.on{display:block}

/* ---------- portada ---------- */
.portada{max-width:520px;margin:0 auto;text-align:center;padding-top:6vh}
.portada .ojo{width:104px;height:auto;margin-bottom:12px}
.portada .lema{color:var(--muted);font-size:.86rem;margin:8px 0 26px;line-height:1.5}
.rolbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--borde);
  background:var(--fondo-2);border-radius:18px;padding:16px;margin-bottom:11px;cursor:pointer;
  font-family:'Poppins';color:var(--texto);box-shadow:var(--sombra)}
.rolbtn:hover{border-color:var(--amarillo)}
.rolbtn .em{font-size:2rem;flex:none}
.rolbtn .t{font-weight:700;font-size:1.02rem}
.rolbtn .d{font-size:.76rem;color:var(--muted);margin-top:2px}
</style>
</head>
<body>

<!-- ============ PORTADA ============ -->
<div id="scr-portada" class="screen active">
  <div class="portada">
    <img id="portada-logo" class="ojo" alt="El Anillo del Cíclope">
    <h1>El Mentor Cíclope</h1>
    <div class="lema">El Archivo de la Casa Amarilla<br>Auditoría, criterio y aprendizaje para dirigir El Anillo del Cíclope</div>
    <button class="rolbtn" onclick="entrar('director')">
      <span class="em">👁️</span>
      <span><span class="t">Dirección · Toño</span><span class="d">Ritual diario, Consejo semanal, auditoría y números</span></span>
    </button>
    <button class="rolbtn" onclick="entrar('gerencia')">
      <span class="em">🗝️</span>
      <span><span class="t">Gerencia · Steph</span><span class="d">Ritual de gerencia y ruta de desarrollo</span></span>
    </button>
    <div id="portada-aviso"></div>
    <div id="portada-version" class="mini mut" style="margin-top:18px"></div>
  </div>
</div>

<!-- ============ PIN ============ -->
<div id="scr-pin" class="screen">
  <div class="portada">
    <h1 id="pin-tit">Acceso</h1>
    <p class="lema" id="pin-sub"></p>
    <div class="pin-dots" id="pin-dots"><span></span><span></span><span></span><span></span></div>
    <div class="pinpad" id="pinpad"></div>
    <button class="btn s" onclick="ir('scr-portada')">Volver</button>
  </div>
</div>

<!-- ============ MENÚ ============ -->
<div id="scr-menu" class="screen">
  <div class="topbar">
    <img id="menu-logo" class="logo" alt="">
    <div>
      <div class="tit" style="font-size:1.05rem" id="menu-tit">Mentor Cíclope</div>
      <div class="sub" id="menu-sub">Dirección</div>
    </div>
    <div class="grow"></div>
    <span class="chip" id="chip-red"><span class="dot"></span><span id="chip-red-t">local</span></span>
    <button class="iconbtn" onclick="toggleTema()">🌓</button>
  </div>
  <div id="menu-saludo"></div>
  <div class="menu-grid" id="menu-grid"></div>
  <div style="margin-top:14px"><button class="btn s" onclick="salir()">Cerrar sesión</button></div>
</div>

<!-- ============ PANTALLAS DE TRABAJO ============ -->
<div id="scr-arranque" class="screen"><div class="topbar" data-bar></div><div id="arranque-body"></div></div>
<div id="scr-hoy" class="screen"><div class="topbar" data-bar></div><div id="hoy-body"></div></div>
<div id="scr-consejo" class="screen"><div class="topbar" data-bar></div><div id="consejo-body"></div></div>
<div id="scr-auditoria" class="screen"><div class="topbar" data-bar></div><div id="auditoria-body"></div></div>
<div id="scr-ciegos" class="screen"><div class="topbar" data-bar></div><div id="ciegos-body"></div></div>
<div id="scr-numeros" class="screen"><div class="topbar" data-bar></div><div id="numeros-body"></div></div>
<div id="scr-escandallo" class="screen"><div class="topbar" data-bar></div><div id="escandallo-body"></div></div>
<div id="scr-misiones" class="screen"><div class="topbar" data-bar></div><div id="misiones-body"></div></div>
<div id="scr-academia" class="screen"><div class="topbar" data-bar></div><div id="academia-body"></div></div>
<div id="scr-retos" class="screen"><div class="topbar" data-bar></div><div id="retos-body"></div></div>
<div id="scr-bitacora" class="screen"><div class="topbar" data-bar></div><div id="bitacora-body"></div></div>
<div id="scr-steph" class="screen"><div class="topbar" data-bar></div><div id="steph-body"></div></div>
<div id="scr-admin" class="screen"><div class="topbar" data-bar></div><div id="admin-body"></div></div>

<button class="fab" id="fab" onclick="volver()">← Volver</button>
<div id="toast"></div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="assets.js"></script>
<script src="contenido.js"></script>
<script src="app.js"></script>
</body>
</html>
